[dotfiles]
"~/.claude/" = { source = ".claude/", mode = "symlink-each" }
"~/.config/aerospace/aerospace.toml" = {}
"~/.config/fish/config.fish" = {}
"~/.config/git/config" = {}
"~/.config/git/global-gitignore" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/jj/config.toml" = {}
"~/.config/ghostty/config.ghostty" = {}

[tasks.brew-dump]
description = "Create a Brewfile for brew packages and casks"
run = "brew bundle dump --file=Brewfile --force --no-go --no-vscode --no-npm"

[tasks.brew-bundle]
description = "Install brew packages and casks from Brewfile"
run = "brew bundle install --file=Brewfile"
"~/.config/zsh/.zprofile" = {}
"~/.config/zsh/.zshrc" = {}
"~/.zshenv" = {}

